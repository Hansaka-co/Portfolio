nrope, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" letter-spacing="1.5" opacity="1" style="">Cormorant Garamond / display</text><text x="72" y="755" fill="#EAF0F4" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">Manrope — UI / body / navigation / metadata</text><rect x="70" y="820" width="180" height="52" rx="26" fill="#EAF0F4" opacity="1"/><text x="160.0" y="853" fill="#06131E" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1" opacity="1" style="">PRIMARY CTA</text><rect x="270" y="820" width="180" height="52" rx="26" fill="none" opacity="1" stroke="#274154" stroke-width="1"/><text x="360.0" y="853" fill="#EAF0F4" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1" opacity="1" style="">SECONDARY</text><rect x="520" y="745" width="350" height="140" rx="10" fill="#0D2232" opacity="1" stroke="#274154" stroke-width="1"/><text x="545" y="782" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">SURFACE CARD</text><text x="545" y="830" fill="#EAF0F4" font-family="Cormorant Garamond, Georgia, serif" font-size="34" font-weight="500" text-anchor="start" style="">Quiet structure.</text><text x="545" y="860" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1" style="">Low radius. Low shadow. Strong hierarchy.</text><rect x="930" y="745" width="430" height="140" rx="4" fill="#112B3D" opacity="1" stroke="#274154" stroke-width="1"/><text x="955" y="782" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">MOTION RULE</text><text x="955" y="824" fill="#EAF0F4" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1" style="">Scroll changes the story.</text><text x="955" y="854" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1" style="">No bouncing. No random motion. No heavy glow.</text></svg>