<text x="68" y="112" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">01</text><text x="120" y="112" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" letter-spacing="3" opacity="1" style="">DESIGN SYSTEM</text><line x1="68" y1="135" x2="1372" y2="135" stroke="#274154" stroke-width="1" opacity="0.6"/><text x="68" y="225" fill="#EAF0F4" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-weight="500" text-anchor="start" style="">Visual language</text><text x="72" y="270" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">Editorial. Cinematic. Purposeful.</text><rect x="70" y="330" width="180" height="120" rx="8" fill="#06131E" opacity="1" stroke="#274154" stroke-width="1"/><text x="70" y="475" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1.5" opacity="1" style="">DEEP OCEAN</text><text x="70" y="500" fill="#EAF0F4" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1" style="">#06131E</text><rect x="285" y="330" width="180" height="120" rx="8" fill="#0A1C2A" opacity="1" stroke="#274154" stroke-width="1"/><text x="285" y="475" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1.5" opacity="1" style="">STORM NAVY</text><text x="285" y="500" fill="#EAF0F4" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1" style="">#0A1C2A</text><rect x="500" y="330" width="180" height="120" rx="8" fill="#0D2232" opacity="1" stroke="#274154" stroke-width="1"/><text x="500" y="475" fill="#9FB0BC" font-family="Manrope, Arial,