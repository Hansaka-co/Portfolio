<text x="68" y="112" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">03</text><text x="120" y="112" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" letter-spacing="3" opacity="1" style="">STORY TRANSITION / THE STORM</text><line x1="68" y1="135" x2="1372" y2="135" stroke="#274154" stroke-width="1" opacity="0.6"/><path d="M920 140 L1440 140 L1440 1024 L1020 1024 L1100 820 L1020 690 L1110 530 L1000 410 Z" fill="#030A10" opacity=".86"/><path d="M930 140 L1440 140 L1440 1024 L1210 1024 L1280 850 L1170 710 L1260 540 L1110 380 Z" fill="#112B3D" opacity=".55"/><text x="72" y="220" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="42" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">01</text><line x1="92" y1="270" x2="92" y2="690" stroke="#9FB8CC" stroke-width="2" opacity="0.6"/><text x="240" y="345" fill="#EAF0F4" font-family="Cormorant Garamond, Georgia, serif" font-size="70" font-weight="500" text-anchor="start" style="">From surviving</text><text x="240" y="422" fill="#EAF0F4" font-family="Cormorant Garamond, Georgia, serif" font-size="70" font-weight="500" text-anchor="start" style="">to thriving.</text><text x="244" y="490" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">The software world is vast, competitive and constantly moving.</text><text x="244" y="520" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">Every storm becomes a lesson. Every obstacle becomes a new skill.</text><text x="246" y="675" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">STORMS</text><text x="400" y="675" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">uncertainty</text><text x="246" y="717" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">OBSTACLES</text><text x="400" y="717" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">complex problems</text><text x="246" y="759" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">LEARNING</text><text x="400" y="759" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">constant growth</text><text x="246" y="801" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">PERSISTENCE</text><text x="400" y="801" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">keep moving</text><text x="246" y="843" fill="#9FB8CC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="2" opacity="1" style="">FREEDOM</text><text x="400" y="843" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1" style="">build your route</text><circle cx="1120" cy="636.6" r="12.4" fill="#EAF0F4" opacity="0.9"/><path d="M 1107.6 652.1 L 1133.95 652.1 L 1143.25 711.0 L 1123.1 707.9 L 1112.25 683.1 L 1095.2 714.1 L 1081.25 707.9 L 1104.5 673.8 Z" fill="#EAF0F4" opacity=".86"/><line x1="1126.2" y1="707.9" x2="1127.75" y2="760.6" stroke="#EAF0F4" stroke-width="6.2" opacity="0.86"/><line x1="1109.15" y1="704.8" x2="1096.75" y2="757.5" stroke="#EAF0F4" stroke-width="6.2" opacity="0.86"/><text x="1265" y="900" fill="#9FB0BC" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="4" opacity="1" style="">SCROLL</text><line x1="1325" y1="865" x2="1325" y2="935" stroke="#9FB8CC" stroke-width="2" opacity="1"/><circle cx="1325" cy="895" r="6" fill="#D1AA6E" opacity="1"/></svg>